# Canonical product/interest values — the single source of truth for what
# "interest" means across the website form, the Cloudflare Worker, and Attio.
# If Attio is ever replaced, this list (not Attio's field config) is what a
# future CRM must be re-mapped to. Keep in sync with the four "pathways" in
# src/content/pages/work-with-odd.json.
version: 1
values:
  - oddference_corporate # attend/bring a team/partner with ODDference
  - oddmembership # year-round membership relationship
  - oddagency # bring a brief, ODD assembles a creative team
  - strategic_partnership # co-create across events/spaces/wider activity
  - other
