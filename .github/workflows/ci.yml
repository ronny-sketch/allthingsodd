name: CI

# Two real, separate bugs fixed here after every run in this repo's history
# had failed at the very first `npm ci` step — see docs/deployment.md#ci-history
# for the full story, including the wrong hypothesis (action versions) tried
# and ruled out before the actual cause was found via the real job log:
#
# 1. actions/checkout/setup-node/upload-artifact bumped v4 -> v7 (GitHub was
#    force-migrating the old v4 pins onto a Node runtime they weren't built
#    for). Legitimate hygiene fix, but NOT what was breaking npm ci.
# 2. The actual cause: `npm install -g npm@11` below. Node 22's bundled npm
#    (10.9.8) fails `npm ci` on this lockfile with "Missing: commander@13.1.0
#    from lock file" — but that's an *optional* peer dependency of
#    @bomb.sh/tab (pulled in transitively by @cloudcannon/cli), which npm 11
#    correctly treats as optional and npm 10.9.8 apparently doesn't. Verified
#    locally: npm 11.8.0 installs this exact lockfile cleanly, including from
#    a genuinely empty cache and a from-scratch regenerated lockfile (byte-
#    identical output) — the lockfile itself was never the problem.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run cc:validate
      # The source half of the identity contract (2026-09-04) — a retired
      # project name reappearing in a doc, a package field or a deploy
      # command is invisible to every browser test in this repo. See
      # scripts/check-identity.mjs.
      - run: npm run check:identity
      - run: npm run build

  functional:
    name: Functional + console errors (cross-browser)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      # chromium + webkit for the functional cross-browser smoke test,
      # firefox likewise — see playwright.config.ts's functional-* projects.
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run build
      - name: Start preview server
        run: npx astro preview --host &
      - name: Wait for preview server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4321 > /dev/null && exit 0
            sleep 1
          done
          echo "Preview server did not come up in time" >&2
          exit 1
      # Deliberately NOT `npm test` (the full suite) — Playwright's default
      # snapshot filenames bake in the OS (`*-darwin.png`, see
      # tests/visual/pages.spec.ts-snapshots/), and every baseline in this
      # repo was generated locally on macOS. Running the full suite here
      # would fail on every screenshot comparison (Linux looks for
      # `*-linux.png`, which doesn't exist) for a reason that has nothing to
      # do with whether the site is actually broken. Visual regression stays
      # a local pre-commit check (`npm test` / `npm run test:update-snapshots`
      # before pushing, as this project already does); CI runs everything
      # else real cross-browser coverage buys — functional interaction tests
      # plus the console-error check, neither of which compares pixels. See
      # docs/deployment.md#ci-history.
      - run: npx playwright test --grep-invert "full page|404 page"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [checks, functional]
    # Only main, and only on an actual push (a green PR doesn't deploy) — a
    # content edit from CloudCannon lands here as a normal push to main, same
    # as a code change, so this is what actually closes the loop from "edit
    # in CloudCannon" to "live on allthingsodd.co". See docs/deployment.md.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      # The canonical production host, cut over from odd-field-guide.surge.sh
      # on 2026-09-03. Published with an explicit https:// scheme, which is
      # how Surge is told to force HTTPS — from then on every plain-http://
      # request to this domain answers with a redirect to the https:// URL
      # (surge.sh/docs/platform/ssl). www.allthingsodd.co needs no publish and
      # no DNS record of its own: Surge folds www onto whichever form of the
      # domain you publish to, so publishing the apex makes the apex canonical
      # and www a redirect onto it automatically (surge.sh/docs/platform/
      # clean-urls). That is also why there is exactly one canonical URL per
      # page here rather than an indexable duplicate on www.
      PRIMARY_DOMAIN: allthingsodd.co
      # The retired production host. Deliberately still published, with the
      # identical build, so no link anywhere on the internet 404s. See
      # LEGACY_REDIRECT below and docs/deployment.md#domain-migration.
      LEGACY_DOMAIN: odd-field-guide.surge.sh
      # ON since 2026-09-03: allthingsodd.co is delegated to Surge, holds a
      # valid certificate and serves this build, so the legacy host can now
      # safely forward visitors to the same path on it (Layout.astro). This
      # was deliberately '0' through the DNS window — turning it on earlier
      # would have bounced every old-host visitor at a domain that didn't
      # answer yet.
      PUBLIC_LEGACY_REDIRECT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      # A public, secret-free fingerprint of exactly which commit this dist/
      # was built from — see docs/deployment.md#deploy-verification for why
      # this exists: on 2026-08-31, every deploy on this workflow silently
      # no-op'd for over an hour (SURGE_TOKEN had gone empty — see the next
      # step's comment) while still reporting a green "Deploy to production"
      # job, because `npx surge`'s own exit code doesn't distinguish "I
      # published" from "I sat at an interactive login prompt with no stdin
      # and gave up." This file is what the verify steps below actually
      # check against, instead of trusting a green checkmark.
      - name: Write build fingerprint
        run: |
          printf '{"sha":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/build-info.json
          cat dist/build-info.json
      - name: Publish to Surge
        env:
          # INTERNAL PROVIDER ACCOUNT — not this site's identity. This is the
          # email the Surge account itself was registered under; changing it
          # means migrating the Surge account, which would orphan every
          # published project including production. It is never rendered
          # anywhere public. See docs/IDENTITY_LAUNCH_MATRIX_2026-09-04.md.
          SURGE_LOGIN: ronny@oddfest.co
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          # The 2026-08-31 incident: SURGE_TOKEN resolved to an empty string
          # (the repo secret had gone missing), so `npx surge` fell through
          # to its interactive "email:" login prompt, hit EOF on the
          # runner's non-interactive stdin, and exited 0 anyway — bash -e
          # never caught it because there was nothing to catch. Refusing to
          # even attempt the publish when the token is empty turns that into
          # a loud, immediate failure instead of an hour of silent no-ops.
          if [ -z "$SURGE_TOKEN" ]; then
            echo "::error::SURGE_TOKEN is empty — refusing to run surge (it would silently no-op at an interactive login prompt instead of failing). Set the SURGE_TOKEN repository secret." >&2
            exit 1
          fi

          # One build, published to two hosts. `publish <domain> <log>`:
          # stdin explicitly from /dev/null so a present-but-invalid token
          # hits an immediate EOF the CLI has to react to, rather than
          # silently succeeding the way an empty token did; and surge's own
          # completion line is grepped, because an exit code alone is exactly
          # what missed the 2026-08-31 incident.
          publish() {
            npx surge dist "$1" < /dev/null | tee "$2"
            # Domain, not an exact phrase: the published target is echoed back
            # with or without the scheme depending on how it was passed.
            grep -Eq "Success!.*${3}" "$2" || {
              echo "::error::surge did not report a completed publish to ${3} — see the log above." >&2
              exit 1
            }
          }

          # Canonical host first, with the scheme, which is what enables
          # Surge's HTTP -> HTTPS redirect for this project.
          publish "https://$PRIMARY_DOMAIN" surge-primary.log "$PRIMARY_DOMAIN"

          # A publish writes a CNAME file into the published directory
          # recording the domain (surge.sh/docs/platform/custom-domains).
          # Removing it before the second publish keeps that leftover out of
          # the legacy host's build and off the CDN, and guarantees the
          # explicit domain argument below is the only thing deciding where
          # this goes.
          rm -f dist/CNAME
          publish "https://$LEGACY_DOMAIN" surge-legacy.log "$LEGACY_DOMAIN"
      - name: Verify production is serving this deploy
        run: |
          # Fetches the fingerprint written above from a live host and
          # compares it to the commit CI actually built. A deploy is not
          # "done" because the publish command returned 0 — it is done when
          # production provably serves this SHA. Retries absorb real CDN
          # propagation delay.
          #
          # `tolerant` exists for exactly one window: allthingsodd.co is
          # published here before its GoDaddy nameservers are delegated to
          # Surge, so until that happens this job would be checking a host
          # that isn't ours yet. The test for that is the domain's NS
          # records, NOT whether it answers — a parked GoDaddy domain
          # resolves fine and serves a valid-certificate 404, which curl
          # reports as a plain exit 0, so no request-level heuristic can tell
          # "not delegated yet" from "genuinely broken". Delegation is the
          # only unambiguous signal, and it flips exactly once.
          #
          # Asked over DNS-over-HTTPS rather than dig, so the job depends on
          # nothing beyond curl and jq, which it already uses.
          delegated_to_surge() {
            curl -fsS --max-time 20 "https://dns.google/resolve?name=$1&type=NS" \
              | jq -r '.Answer[]?.data' | grep -qi 'surge\.world'
          }

          verify() {
            host="$1"; mode="$2"

            if [ "$mode" = "tolerant" ] && ! delegated_to_surge "$host"; then
              echo "::warning::${host} is not delegated to Surge's nameservers yet, so this deploy cannot be verified there. The publish itself succeeded and will serve as soon as DNS lands. ${LEGACY_DOMAIN} is verified strictly below and is authoritative for this deploy. See docs/deployment.md#dns-and-https."
              return 0
            fi

            for i in 1 2 3 4 5 6 7 8; do
              live="$(curl -fsS --max-time 20 "https://${host}/build-info.json?verify=$GITHUB_SHA" | jq -r .sha 2>/dev/null || true)"
              if [ "$live" = "$GITHUB_SHA" ]; then
                echo "${host} verified at $GITHUB_SHA"
                return 0
              fi
              echo "Attempt $i/8: ${host} reports '${live}', expected '$GITHUB_SHA' — retrying in 5s..."
              sleep 5
            done

            echo "::error::${host} is not serving the deployed SHA $GITHUB_SHA after retries — the publish step reported success but production disagrees. Do not treat this deploy as live." >&2
            return 1
          }

          # www must answer HTTPS with a VALID certificate and a 301 onto the
          # apex, carrying the path across. Both halves matter and neither is
          # theoretical:
          #
          # - The 301 is Surge's automatic www-folding, which only applies
          #   while no project is published AT www. Publishing anything there
          #   replaces the redirect with that project's content.
          # - The certificate is the fragile half. Surge issues certificates
          #   per published domain, so on 2026-09-03 www had none and served
          #   the default *.surge.sh cert — a browser-visible error on the
          #   canonical domain's most likely typo. It was fixed by publishing
          #   www once purely to trigger issuance, then tearing that project
          #   down so the automatic 301 resumed; the certificate survived.
          #   Because www is no longer a project, its auto-renewal cannot be
          #   inspected (`surge www.<domain> debug certs` returns
          #   Unauthorized), so whether it renews at ~90 days is genuinely
          #   unknown rather than assumed. This check is the safety net: curl
          #   without -k fails on an invalid certificate, so a lapse fails a
          #   deploy loudly instead of surfacing as a security warning to a
          #   visitor. See docs/deployment.md#www-and-its-certificate.
          verify_www() {
            www="www.$1"
            location="$(curl -sSI --max-time 20 "https://${www}/oddfest" | tr -d '\r' | awk 'tolower($1) == "location:" { print $2 }')"
            if [ "$location" = "https://$1/oddfest" ]; then
              echo "${www} verified: 301 -> ${location}, certificate valid"
              return 0
            fi
            echo "::error::${www} did not redirect to https://$1/oddfest as expected (got '${location:-no redirect, or the request failed}'). Either Surge's automatic www-folding stopped applying — check nothing has been published to ${www} — or its certificate has lapsed, which curl reports as a failed request. See docs/deployment.md#www-and-its-certificate." >&2
            return 1
          }

          # Once the nameservers are delegated, the tolerant branch can never
          # be taken again and the canonical host is checked as strictly as
          # the legacy one. Nothing to edit when that happens.
          verify "$PRIMARY_DOMAIN" tolerant
          verify "$LEGACY_DOMAIN" strict
          if delegated_to_surge "$PRIMARY_DOMAIN"; then
            verify_www "$PRIMARY_DOMAIN"
          fi
      - name: Verify the other ODD domains redirect here
        run: |
          # oddfest.co and oddspace.co are supposed to be controlled entry
          # points into allthingsodd.co, not parallel websites (2026-09-04 —
          # see docs/IDENTITY_LAUNCH_MATRIX_2026-09-04.md §Legacy domains).
          # At the time this was written both still served their own old
          # standalone site, and neither can be changed from this repo:
          # oddfest.co is a Vercel project on GoDaddy DNS carrying Google
          # Workspace mail, oddspace.co is WordPress on Hostinger.
          #
          # This check adapts rather than being flipped by hand, the same way
          # `delegated_to_surge` above does. A domain that has not been
          # migrated yet warns; one that HAS been migrated is then held to it
          # forever, so a redirect that later breaks or points somewhere
          # wrong fails the deploy loudly. There is no switch to remember.
          #
          # "Migrated" means: the domain answers with a 3xx whose Location is
          # on allthingsodd.co. Anything else — a 200 (still the old site), a
          # 3xx somewhere else, a redirect chain that lands off-domain — is
          # either "not done yet" or "done wrong", and the two are told apart
          # by whether a redirect to us was ever seen at all.
          fail=0

          check_legacy_domain() {
            host="$1"; expected="$2"
            # The registrable domain, so "www.oddfest.co -> oddfest.co" can be
            # recognised as the old site's own www-folding (i.e. not migrated
            # yet) rather than mistaken for a redirect somewhere unintended.
            apex="${host#www.}"

            # -I, no -L: the FIRST hop is what matters. A chain that starts
            # by 301ing to the old site and only later reaches us would still
            # have shown a visitor the old page.
            headers="$(curl -sSI --max-time 20 "https://${host}/" 2>&1)" || {
              echo "::warning::${host} did not answer HTTPS with a valid certificate. If it has just been repointed, DNS or the certificate may still be settling; if it has not been migrated yet, this is expected. Not failing the deploy."
              return 0
            }

            status="$(printf '%s' "$headers" | head -n1 | awk '{print $2}')"
            location="$(printf '%s' "$headers" | tr -d '\r' | awk 'tolower($1) == "location:" { print $2 }' | tail -n1)"

            case "$location" in
              https://allthingsodd.co*)
                if [ "$location" = "$expected" ]; then
                  echo "${host} verified: ${status} -> ${location}"
                  return 0
                fi
                echo "::error::${host} redirects to ${location}, but the agreed destination is ${expected}. See docs/IDENTITY_LAUNCH_MATRIX_2026-09-04.md for the redirect map." >&2
                return 1
                ;;
              '')
                echo "::warning::${host} answered ${status} with no redirect — it is still serving its own site rather than forwarding to ${expected}. This is a known launch blocker (registrar/host credentials are outside this repo), not a regression in this deploy."
                return 0
                ;;
              https://"$apex"/*|https://"$apex"|http://"$apex"/*|http://"$apex")
                # Still pointing at itself. Same unmigrated state as the bare
                # 200 above, just reached via the old site's own www-folding.
                echo "::warning::${host} still folds onto ${location} — its own old site — rather than forwarding to ${expected}. Known launch blocker, not a regression in this deploy."
                return 0
                ;;
              *)
                echo "::error::${host} redirects to ${location}, which is not on allthingsodd.co. A visitor following an old ODD link is being sent somewhere unintended." >&2
                return 1
                ;;
            esac
          }

          check_legacy_domain oddfest.co       https://allthingsodd.co/oddfest  || fail=1
          check_legacy_domain www.oddfest.co   https://allthingsodd.co/oddfest  || fail=1
          check_legacy_domain oddspace.co      https://allthingsodd.co/oddspace || fail=1
          check_legacy_domain www.oddspace.co  https://allthingsodd.co/oddspace || fail=1

          exit $fail
    # Growth OS's own Cloudflare Worker deploy (formerly a
    # `deploy-cloudflare-preview` job here) now lives in its own repo,
    # ../odd-growth-os, with its own CI — see that repo's
    # .github/workflows/ci.yml and AGENTS.md's "Growth OS integration"
    # section for the /api/* boundary this site's forms rely on.
