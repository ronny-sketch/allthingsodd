name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  visual:
    name: Visual regression + console errors
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Start preview server
        run: npx astro preview --host &
      - name: Wait for preview server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4321 > /dev/null && exit 0
            sleep 1
          done
          echo "Preview server did not come up in time" >&2
          exit 1
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [checks, visual]
    # Only main, and only on an actual push (a green PR doesn't deploy) — a
    # content edit from CloudCannon lands here as a normal push to main, same
    # as a code change, so this is what actually closes the loop from "edit
    # in CloudCannon" to "live on odd-field-guide.surge.sh". See
    # docs/deployment.md.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx surge dist odd-field-guide.surge.sh
        env:
          SURGE_LOGIN: ronny@oddfest.co
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
