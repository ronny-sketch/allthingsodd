name: CI

# Two real, separate bugs fixed here after every run in this repo's history
# had failed at the very first `npm ci` step — see docs/deployment.md#ci-history
# for the full story, including the wrong hypothesis (action versions) tried
# and ruled out before the actual cause was found via the real job log:
#
# 1. actions/checkout/setup-node/upload-artifact bumped v4 -> v7 (GitHub was
#    force-migrating the old v4 pins onto a Node runtime they weren't built
#    for). Legitimate hygiene fix, but NOT what was breaking npm ci.
# 2. The actual cause: `npm install -g npm@11` below. Node 22's bundled npm
#    (10.9.8) fails `npm ci` on this lockfile with "Missing: commander@13.1.0
#    from lock file" — but that's an *optional* peer dependency of
#    @bomb.sh/tab (pulled in transitively by @cloudcannon/cli), which npm 11
#    correctly treats as optional and npm 10.9.8 apparently doesn't. Verified
#    locally: npm 11.8.0 installs this exact lockfile cleanly, including from
#    a genuinely empty cache and a from-scratch regenerated lockfile (byte-
#    identical output) — the lockfile itself was never the problem.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run cc:validate
      - run: npm run build

  functional:
    name: Functional + console errors (cross-browser)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      # chromium + webkit for the functional cross-browser smoke test,
      # firefox likewise — see playwright.config.ts's functional-* projects.
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run build
      - name: Start preview server
        run: npx astro preview --host &
      - name: Wait for preview server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4321 > /dev/null && exit 0
            sleep 1
          done
          echo "Preview server did not come up in time" >&2
          exit 1
      # Deliberately NOT `npm test` (the full suite) — Playwright's default
      # snapshot filenames bake in the OS (`*-darwin.png`, see
      # tests/visual/pages.spec.ts-snapshots/), and every baseline in this
      # repo was generated locally on macOS. Running the full suite here
      # would fail on every screenshot comparison (Linux looks for
      # `*-linux.png`, which doesn't exist) for a reason that has nothing to
      # do with whether the site is actually broken. Visual regression stays
      # a local pre-commit check (`npm test` / `npm run test:update-snapshots`
      # before pushing, as this project already does); CI runs everything
      # else real cross-browser coverage buys — functional interaction tests
      # plus the console-error check, neither of which compares pixels. See
      # docs/deployment.md#ci-history.
      - run: npx playwright test --grep-invert "full page|404 page"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [checks, functional]
    # Only main, and only on an actual push (a green PR doesn't deploy) — a
    # content edit from CloudCannon lands here as a normal push to main, same
    # as a code change, so this is what actually closes the loop from "edit
    # in CloudCannon" to "live on odd-field-guide.surge.sh". See
    # docs/deployment.md.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      # A public, secret-free fingerprint of exactly which commit this dist/
      # was built from — see docs/deployment.md#deploy-verification for why
      # this exists: on 2026-08-31, every deploy on this workflow silently
      # no-op'd for over an hour (SURGE_TOKEN had gone empty — see the next
      # step's comment) while still reporting a green "Deploy to production"
      # job, because `npx surge`'s own exit code doesn't distinguish "I
      # published" from "I sat at an interactive login prompt with no stdin
      # and gave up." This file is what the last two steps below actually
      # check against, instead of trusting a green checkmark.
      - name: Write build fingerprint
        run: |
          printf '{"sha":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/build-info.json
          cat dist/build-info.json
      - name: Publish to Surge
        env:
          SURGE_LOGIN: ronny@oddfest.co
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          # The 2026-08-31 incident: SURGE_TOKEN resolved to an empty string
          # (the repo secret had gone missing), so `npx surge` fell through
          # to its interactive "email:" login prompt, hit EOF on the
          # runner's non-interactive stdin, and exited 0 anyway — bash -e
          # never caught it because there was nothing to catch. Refusing to
          # even attempt the publish when the token is empty turns that into
          # a loud, immediate failure instead of an hour of silent no-ops.
          if [ -z "$SURGE_TOKEN" ]; then
            echo "::error::SURGE_TOKEN is empty — refusing to run surge (it would silently no-op at an interactive login prompt instead of failing). Set the SURGE_TOKEN repository secret." >&2
            exit 1
          fi
          # stdin explicitly from /dev/null: if the token is present but
          # invalid, this is what turns a hung/eaten prompt into an
          # immediate EOF the CLI has to react to, rather than silently
          # succeeding the same way an empty token did.
          npx surge dist odd-field-guide.surge.sh < /dev/null | tee surge-publish.log
          grep -q "Success!.*Published to odd-field-guide.surge.sh" surge-publish.log || {
            echo "::error::surge did not report a completed publish — see the log above." >&2
            exit 1
          }
      - name: Verify production is serving this deploy
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            LIVE_SHA="$(curl -fsS "https://odd-field-guide.surge.sh/build-info.json?verify=$GITHUB_SHA" | jq -r .sha 2>/dev/null || true)"
            if [ "$LIVE_SHA" = "$GITHUB_SHA" ]; then
              echo "Production verified at $GITHUB_SHA"
              exit 0
            fi
            echo "Attempt $i/8: production reports '$LIVE_SHA', expected '$GITHUB_SHA' — retrying in 5s..."
            sleep 5
          done
          echo "::error::Production is not serving the deployed SHA $GITHUB_SHA after retries — the publish step reported success but production disagrees. Do not treat this deploy as live." >&2
          exit 1
    # Growth OS's own Cloudflare Worker deploy (formerly a
    # `deploy-cloudflare-preview` job here) now lives in its own repo,
    # ../odd-growth-os, with its own CI — see that repo's
    # .github/workflows/ci.yml and AGENTS.md's "Growth OS integration"
    # section for the /api/* boundary this site's forms rely on.
