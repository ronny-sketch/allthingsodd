name: CI

# actions/checkout, actions/setup-node and actions/upload-artifact are
# pinned at v7 (not v4) — every run in this repo's history had failed at the
# very first `npm ci` step, and GitHub Actions had started force-migrating
# the old v4 pins onto a Node runtime they weren't built for ("Node.js 20 is
# deprecated... forced to run on Node.js 24", visible in the run annotations)
# — the exact symptom of a runner-environment problem right after
# setup-node's own environment setup step. The lockfile/dependencies
# themselves check out fine locally (including a from-scratch install with
# an empty cache), so this wasn't a project-code problem. See
# docs/deployment.md#ci-history if this needs revisiting.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run cc:validate
      - run: npm run build

  visual:
    name: Visual regression + functional + console errors
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # chromium + webkit for the visual-regression matrix, firefox added for
      # the functional cross-browser smoke test — see playwright.config.ts.
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run build
      - name: Start preview server
        run: npx astro preview --host &
      - name: Wait for preview server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4321 > /dev/null && exit 0
            sleep 1
          done
          echo "Preview server did not come up in time" >&2
          exit 1
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [checks, visual]
    # Only main, and only on an actual push (a green PR doesn't deploy) — a
    # content edit from CloudCannon lands here as a normal push to main, same
    # as a code change, so this is what actually closes the loop from "edit
    # in CloudCannon" to "live on odd-field-guide.surge.sh". See
    # docs/deployment.md.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx surge dist odd-field-guide.surge.sh
        env:
          SURGE_LOGIN: ronny@oddfest.co
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
