# Cloudflare Worker config for the ODD Growth OS migration
# (ops/DECISIONS.md — Surge → Cloudflare Workers Static Assets).
#
# ⚠ UNVERIFIED — no Cloudflare account exists yet (ops/SETUP_STATUS.md).
# This follows Cloudflare's documented Workers Static Assets + Worker script
# pattern as of this writing. Before first deploy: run `npx wrangler dev` and
# `npx wrangler deploy --dry-run`, verify against https://developers.cloudflare.com/workers/static-assets/,
# and correct anything that's drifted (field names/behaviour of Workers
# Static Assets have changed before). Do not treat this file as working
# config until a real `wrangler dev` run has been observed.
#
# Astro's static build output stays exactly as-is (`npm run build` → `dist/`)
# — this file does NOT change how Astro builds, only how the result is
# served. No `@astrojs/cloudflare` adapter, no `output: "server"`.

name = "odd-field-guide"
main = "worker/src/index.ts"
compatibility_date = "2026-08-21"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page" # serves dist/404.html — matches src/pages/404.astro

# Secrets (ATTIO_API_KEY, BEEHIIV_API_KEY, BEEHIIV_PUBLICATION_ID) are never
# set here. Local dev: worker/.dev.vars (gitignored, see .dev.vars.example).
# Production: `npx wrangler secret put <NAME>` — see docs/deployment.md.
