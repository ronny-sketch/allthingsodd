source: .
collections_config:
  pages:
    path: src/content/pages
    name: Pages
    icon: description
    disable_url: false
    include_developer_files: false
    preview:
      text:
        - key: title
        - key: eyebrow
    _inputs:
      seo:
        type: object
        options:
          subtype: object
          groups:
            - heading: SEO
              comment: Browser tab title and search-result snippet.
              collapsed: false
              inputs:
                - title
                - description
          required: false
        cascade: true
      news:
        type: array
        options:
          structures:
            - news_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        comment: Homepage photo filmstrip — reorder here reorders the live site.
        cascade: true
      whatsOn:
        type: object
        options:
          subtype: object
          required: false
        cascade: true
      programGrid:
        type: array
        options:
          structures:
            - program_card
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      participate:
        type: array
        options:
          structures:
            - cta
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      features:
        type: array
        options:
          structures:
            - feature_card
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      panels:
        type: array
        options:
          structures:
            - about_panel_media
            - about_panel_model
            - about_panel_text
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        comment: The five horizontal-scroll panels on the About page, in order.
        cascade: true
    add_options:
      - name:
        icon:
        editor:
        base_path:
        collection:
        schema:
        default_content_file:
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
  site:
    path: src/content/site
    name: Global
    singular_name: Global content
    icon: public
    disable_url: false
    include_developer_files: false
    _inputs:
      nav:
        type: array
        comment: >-
          Top nav + footer nav (shared). ODDspace is external — leave
          external:true.
        cascade: true
      social:
        type: array
        cascade: true
      contact:
        type: array
        cascade: true
    disable_add: true
    disable_add_folder: false
    disable_file_actions: true
_structures:
  news_item:
    style: select
    values:
      - default: false
        preview:
          text:
            - key: caption
          image:
            - key: image
        place_groups_below: false
        tabbed: false
        value:
          image:
          caption: ''
          href: '#'
  program_card:
    style: select
    values:
      - default: false
        preview:
          text:
            - key: title
          image:
            - key: image
        place_groups_below: false
        tabbed: false
        value:
          meta: ''
          title: ''
          body: ''
          goLabel: ''
          href: '#'
          image:
  cta:
    style: select
    values:
      - default: false
        preview:
          text:
            - key: title
        place_groups_below: false
        tabbed: false
        value:
          eyebrow: ''
          title: ''
          linkLabel: ''
          href: '#'
  feature_card:
    style: select
    values:
      - default: false
        preview:
          text:
            - key: title
        place_groups_below: false
        tabbed: false
        value:
          number: '01'
          title: ''
          body: ''
  about_panel_media:
    style: select
    values:
      - default: false
        preview:
          text:
            - key: title
        place_groups_below: false
        tabbed: false
        value:
          kind: media
          image:
          alt: ''
          eyebrow: ''
          title: ''
          body: ''
  about_panel_model:
    style: select
    values:
      - default: false
        preview:
          text:
            - key: title
        place_groups_below: false
        tabbed: false
        value:
          kind: model
          eyebrow: ''
          title: ''
          items: []
  about_panel_text:
    style: select
    values:
      - default: false
        preview:
          text:
            - key: title
        place_groups_below: false
        tabbed: false
        value:
          kind: text
          eyebrow: ''
          title: ''
          body: ''
timezone: Etc/UTC
