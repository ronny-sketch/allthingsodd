source: .
collections_config:
  pages:
    path: src/content/pages
    name: Pages
    icon: description
    # index.json -> "" (Astro's own home-route convention, matched here) ->
    # "/". Every other file's name already equals its real route
    # (oddfest.json -> /oddfest/, etc.) — see astro.config.mjs's default
    # build.format: "directory", which is why every route needs the
    # trailing slash.
    url: '/[slug]/'
    disable_url: false
    include_developer_files: false
    preview:
      text:
        - key: title
        - key: eyebrow
    _inputs:
      seo:
        type: object
        options:
          subtype: object
          groups:
            - heading: SEO
              comment: Browser tab title, search-result snippet, and social share image.
              collapsed: false
              inputs:
                - title
                - description
                - ogImage
          required: false
        cascade: true
      platforms:
        type: array
        label: The ODD platform (Home only)
        comment: >-
          The large photo cards for ODDfest / ODDference / ODDspace — the
          three primary masterbrand destinations only (2026-08-31: Work with
          ODD moved to its own quieter `workWithOdd` card below, so it no
          longer competes with these three for equal visual weight). Not
          fixed at three — add or remove a card and the grid reflows; a card
          can also skip its photo (falls back to a plain surface) if none is
          set.
        options:
          structures: _structures.program_card
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      workWithOdd:
        type: object
        label: '"Work with ODD" quiet pathway card (Home only)'
        comment: >-
          A full-width banner sitting directly under the three platform
          cards (moved back there 2026-09-11) — the next step after them,
          for anyone wanting something bigger than one programme.
          Deliberately not another giant photo card: Work with ODD is a
          deeper way to work with ODD, not a fourth equal masterbrand
          product, and what keeps it from reading as one is that it has no
          photo and no grid cell. Its "body" is one short sentence — this
          band is a signpost, not a pitch.
        options:
          subtype: object
      pathways:
        type: array
        label: Ways to work with us (Work with ODD only)
        comment: >-
          The four entry points — ODDference / ODDnetwork / Event
          partnerships / ODDagency — shown as a compact progression list, not
          a funnel: any card can be the first thing an organisation does.
        options:
          structures: _structures.pathway_card
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      participateTitle:
        type: text
        label: Participation band headline (Home only)
        comment: >-
          The headline over Home's closing "ways to participate" cards —
          "The way in is by doing." Editorial copy, so it lives in content
          rather than in the page template; it was hardcoded until
          2026-09-03, which is how it kept an older wording through a full
          copywriting pass.
      participate:
        type: array
        label: '"Ways to participate" cards'
        comment: >-
          Home and About only (2026-09-02: removed from ODDagency in favour
          of a single-link `closingCta`). Not on ODDspace — its rebuilt
          "Enter the space" section replaces this with its own dedicated
          membership/event-enquiry pair.

          On Home each card's "audience" ("For creatives" / "For business")
          renders as a heading ABOVE its run of cards, not as a label inside
          them (2026-09-11) — so cards sharing an audience must stay next to
          each other in this list, and the creative ones come first. That
          creatives-before-business order is a sitewide rule, and a test
          fails the build if this array is reordered against it. Elsewhere
          "audience" is just a small label inside the card.
        options:
          structures: _structures.cta
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      primaryCta:
        type: object
        label: Primary button
        comment: >-
          The solid button in the hero — "Buy Blind Bird" on ODDference,
          "Become a member" on ODDspace (also reused in ODDspace's "Enter
          the space" section), "Start a conversation" on Work with ODD
          (scrolls to the enquiry form), and the submit-an-event link on
          ODDfest. Home, ODDagency and About don't use this field.
        options:
          subtype: object
      secondaryCta:
        type: object
        label: Secondary button (ODDfest / ODDference / ODDspace)
        comment: >-
          The outline hero button — "Partner with ODDference" on ODDference,
          "Organise an event" on ODDspace (also reused in ODDspace's "Enter
          the space" section), and the look-back-at-2026 link on ODDfest.
        options:
          subtype: object
          required: false
      heroMedia:
        type: object
        label: Hero video/image
        comment: >-
          Which of "video"/"poster"/"image" actually apply depends on the
          page — ODDfest and ODDference use a video + poster frame,
          ODDagency uses a single still image instead. ODDspace uses
          heroPhotos (below) instead of this field — leave it empty on
          ODDspace. Leave the ones the page doesn't use empty.
        options:
          subtype: object
      heroSupport:
        type: text
        label: Hero support line (not currently shown)
        comment: >-
          A short paragraph under the hero's h1. No page renders it at the
          moment: ODDference and ODDfest both use ODDspace's hero composition
          (wordmark / short headline / meta / buttons, no paragraph) —
          ODDference since 2026-09-11, when this line moved into "The
          premise" below, and ODDfest since 2026-09-14, when it was cut.
          Only ODDference's content model still accepts the field, and text
          here appears nowhere.
      heroPhotos:
        type: array
        label: Hero photo grid (ODDspace only)
        comment: >-
          Real photos of the space for the hero's photo grid — roughly 6-8
          reads best. Each needs its own alt text describing what's actually
          shown.
        options:
          structures: _structures.oddspace_hero_photo
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      railLeft:
        type: array
        label: Left side ticker (decorative)
        comment: >-
          The scrolling logo/word/date strip fixed to the left edge on
          desktop. Low editorial priority — safe to leave as-is.
        cascade: true
      railRight:
        type: array
        label: Right side ticker (decorative)
        comment: Same as the left ticker, mirrored on the right edge.
        cascade: true
      argument:
        type: array
        label: The deeper "why" case (About only)
        comment: >-
          The paragraphs below About's opening headline/intro — the fuller
          editorial case for why ODD exists. Each array entry is its own
          paragraph; keep them as separate short paragraphs rather than one
          long block.
        options:
          required: false
        cascade: true
      howWeMakeItHappen:
        type: object
        label: What we build (About only)
        comment: >-
          The "pillars" (events/spaces/projects, 01-03) render right after
          the opening argument; "principles" ("Ways of working") render lower on the
          page, after the timeline — both still live in this one field
          (see about.astro), just rendered in two places.
        options:
          subtype: object
      impact:
        type: object
        label: 2025–2026 in numbers (About only)
        comment: >-
          ODD's cumulative figures — the same four as the homepage's
          "Already in motion" row. Change a number here and change it on the
          homepage too. Never add a figure that hasn't been verified.
          "ctas" are the buttons under the figures (today: the 2025 Impact
          Report and the ODDfest 2026 thank-you page).
        options:
          subtype: object
      ctas:
        type: array
        label: Buttons
        comment: >-
          One button per entry, shown side by side under the figures. The
          arrow is added automatically — don't type one into the label.
        cascade: true
      launchPhoto:
        type: object
        label: ODDfest 2026 launch photo (About only)
        comment: >-
          The full-bleed group photo from the ODDfest 2026 launch, right
          after the opening argument. Remove the whole field to hide it.
        options:
          subtype: object
          required: false
      opening:
        type: object
        label: Proposition (Home only)
        comment: >-
          The headline that renders directly under the ODD logo inside the
          hero mosaic itself — this is the page's real "what is ODD" moment.
          Its two optional buttons render further down the page instead, in
          the "Why ODD" section (see index.astro).
        options:
          subtype: object
      whatOddIs:
        type: object
        label: '"Why ODD" (Home only)'
        comment: >-
          The homepage's main explanatory passage, set around a grid with
          one photograph in it. The headline sets at the site's largest size:
          keep it to two short sentences — the first renders quieter as the
          premise, the second at full brightness as the point. In the body,
          leave a BLANK LINE between points and each becomes its own
          paragraph; two paragraphs sit side by side on desktop.
        options:
          subtype: object
      missingPieces:
        type: array
        label: Labels around the photo (Home "Why ODD" only)
        comment: >-
          Up to four short labels set in the empty grid cells around the
          photograph, read left to right, top to bottom. They name what the
          body says has to be found again — keep each to a few words so it
          fits its cell on a phone.
        options:
          required: false
        cascade: true
      whatItIs:
        type: object
        label: '"What it is" intro'
        comment: >-
          Appears on ODDspace — the page's own short explainer section. On
          ODDfest this same field is the "What ODDfest is" section — the
          consolidated made-across-Helsinki / organisers-keep-ownership /
          ODD-provides-the-umbrella story, with its own optional cta as the
          page's earlier "register" link. (2026-09-02: removed from
          ODDagency, folded into its hero intro; also removed from
          Membership, replaced by "whyThisExists"/"whatWeAreShaping" below.)
        options:
          subtype: object
      whyThisExists:
        type: object
        label: '"Why this exists" (Membership only)'
        comment: >-
          NEW (2026-09-02 copywriting pass): explains the need for a
          year-round organisational relationship without promising benefits
          that are not yet designed. Rendered right after the hero.
        options:
          subtype: object
      whatWeAreShaping:
        type: object
        label: '"What we are shaping" (Membership only)'
        comment: >-
          SIMPLIFIED (2026-09-02 copywriting pass) from a "what it is" intro
          plus a three-card audience list ("whoItsFor") plus a three-card
          benefit grid ("includes") down to one deliberately small
          paragraph with a single CTA. Keep this small until ODDnetwork's
          offer, cadence, tiers and annual price are actually approved —
          don't re-add audience/benefit cards without a real product
          decision behind them.
        options:
          subtype: object
      whatWeDo:
        type: object
        label: '"Why ODD" intro (Work with ODD only)'
        comment: >-
          The page's merged "Why ODD" explanation (2026-09-02 copywriting
          pass folded the old three-card whyOdd grid into this single
          paragraph), rendered after the Pathways list, not before it.
        options:
          subtype: object
      visit:
        type: object
        label: Address + directions (ODDspace only)
        comment: >-
          The real street address, shown as one quiet line inside "Enter the
          space" with a directions link — not a dedicated section.
          "directionsUrl" should stay a Google Maps link for the same real
          address in "address"; don't point it anywhere else.
        options:
          subtype: object
      spaces:
        type: array
        label: The four spaces (ODDspace only)
        comment: >-
          Co-working / event & gallery / auditorium / studio, each with its
          own photo and its own button ("goLabel" + "href" — the label on
          the button and where it goes; leave both empty for no button).
          Point each one at the enquiry for that room, or at a real page.
          The membership benefits list itself now lives on "membership"
          below, not here.
        options:
          structures: _structures.oddspace_space
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      membership:
        type: object
        label: Membership (ODDspace only)
        comment: >-
          One flat membership tier (not an array like ODDference's tickets
          or Membership's tiers) — ODDspace's real pricing is deliberately
          one rate, no tiers.
        options:
          subtype: object
      studioCallout:
        type: object
        label: '"The studio is not included" callout (ODDspace only)'
        comment: >-
          Sits directly under the EUR150 membership price and is the one
          place that page states ODDstudio is booked separately. Edit the
          wording freely, but it must keep saying that the studio is not in
          the membership — that is the whole reason the block exists, and
          tests/functional/oddstudio.spec.ts fails if it stops. Keep the
          figures in step with the ODDstudio page's own rates.
        options:
          subtype: object
      kit:
        type: array
        label: What's in the room (ODDstudio only)
        comment: >-
          The four equipment groups — monitoring, microphones, instruments,
          the room itself. Same card shape as ODDspace's "spaces". Only list
          equipment that is genuinely in the studio; this is what someone
          books on.
        options:
          required: false
        cascade: true
      access:
        type: object
        label: Access + pricing intro (ODDstudio only)
        comment: >-
          The paragraph that states the studio is not part of the EUR150
          ODDspace membership. Same rule as studioCallout above — reword it,
          but do not remove the fact.
        options:
          subtype: object
      memberRates:
        type: array
        label: Studio rates for ODDspace members (ODDstudio only)
        comment: >-
          Deliberately a separate list from publicRates so the page can never
          imply a non-member books at the member rate. Real, current prices
          only.
        options:
          required: false
        cascade: true
      publicRates:
        type: array
        label: Studio rates without a membership (ODDstudio only)
        comment: >-
          The standard rate card for anyone without an ODDspace membership.
        options:
          required: false
        cascade: true
      ratesNote:
        type: text
        label: VAT + payment terms (ODDstudio only)
        comment: >-
          Shown under both rate tables. VAT treatment and payment terms are a
          legal requirement on a published price, not a nicety — do not empty
          this.
      houseRules:
        type: object
        label: Studio house rules (ODDstudio only)
        comment: >-
          The short public list of how to treat the room. Operational secrets
          (the key-box code) and private contact details belong in the
          internal house-rules document, never here.
        options:
          subtype: object
      terms:
        type: array
        label: Individual booking terms (ODDstudio only)
        comment: >-
          The booking terms, rendered as an accordion. These are contractual
          — change them with TUNEMENT, not unilaterally.
        options:
          required: false
        cascade: true
      operator:
        type: object
        label: Who runs the studio (ODDstudio only)
        comment: >-
          TUNEMENT is a real third party and this block is what stops the
          page reading as though ODD takes the bookings. Use the business
          email only — a personal phone number is that person's to publish,
          not ours.
        options:
          subtype: object
      photoCredit:
        type: text
        label: Photographer credit (ODDstudio only)
        comment: Credit line for the photography on this page.
      rentalRates:
        type: array
        label: Event space rental rates (ODDspace only)
        comment: >-
          Member pricing for renting the gallery/auditorium, shown inside
          the "organise an event" card in "Enter the space". No invented
          prices — these are real, current rates.
        options:
          required: false
        cascade: true
      eventEnquiry:
        type: object
        label: Event enquiry copy (ODDspace only)
        comment: >-
          The "Want to organise an event?" half of "Enter the space" —
          membership's half of that section reuses "membership" and
          "primaryCta" directly instead of a second copy block.
        options:
          subtype: object
      vision:
        type: object
        label: '"Why ODDspace" / the bigger picture (ODDspace only)'
        comment: >-
          The longer-term reasoning for why ODDspace exists — kept separate
          from "whatItIs" (the concrete, practical explainer) so the two
          don't repeat each other. Keep this to what's actually been
          approved for public communication — no invented future buildings,
          locations, funding or partners.
        options:
          subtype: object
      events:
        type: object
        label: '"What''s happening" events list (ODDspace only)'
        comment: >-
          Replaced the embedded Google Calendar on 2026-09-11. This list is
          kept by hand, so it is only as right as the last edit — when a
          date moves or an event is cancelled, change it here, because
          nothing syncs it from the booking calendar. Only list things a
          stranger can actually turn up to or book; private bookings stay
          on the internal calendar. Each item takes a date ("Every Monday",
          "Sat 26 Sep"), a time, where in the building it is, a short
          description, and an optional link.
        options:
          subtype: object
          required: false
      instagram:
        type: object
        label: Instagram wall framing (ODDspace only)
        comment: >-
          Eyebrow, headline and follow-link label for the live @oddspace.co
          gallery under the events list. Editorial framing only — which account
          it pulls from, which provider serves it and how many posts it shows
          are technical config in the codebase, not editable here. The
          section is hidden entirely until the feed is connected.
        options:
          subtype: object
          required: false
      gallery:
        type: object
        label: Photo wall (ODDspace and About)
        comment: >-
          ODDspace: photos of the space in use, under the events list. About:
          ODDfest 2025 and 2026, host events and ODDspace, under the figures.
          Add as many as you like, portrait or landscape, in any order — the
          wall arranges them by shape, so it can't be left with gaps. Remove
          the whole section to hide the wall.
        options:
          subtype: object
          required: false
      photos:
        type: array
        label: Photos
        comment: >-
          Real photos of people at ODD's events and spaces. Each needs its own
          alt text describing what's actually shown — don't name people in it.
        options:
          structures: _structures.oddspace_gallery_photo
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
      twoWaysIn:
        type: object
        label: '"Who ODD is for" (Home only)'
        comment: >-
          The creative/business dual-entry section. Keep the framing
          reciprocal, not "business buys, creatives belong". Creatives render
          on the left and business on the right — a sitewide rule, enforced
          by a test, not something to flip here. Each side's "tracks" are its
          destination buttons (creatives: ODDfest, ODDspace; business:
          ODDference, Work with ODD): give a track a "label" and an "href"
          and leave "meta" empty for a button. Two or three per side — this
          section routes people, it does not list everything ODD runs.
        options:
          subtype: object
      proof:
        type: object
        label: Proof / traction
        comment: >-
          Home only. It was also on ODDspace with an empty "items" (the
          public member-count and square-metre figures were disputed
          against the canonical Current State doc), so it rendered nothing
          there for nine days and was removed from that page on
          2026-09-11 — put it back deliberately, with real verified
          figures, rather than as an empty block. Elsewhere, leave this
          field out of the page entirely (delete it) rather than filling
          it with invented numbers. About uses its own "impact"
          field instead (two year-snapshots, not one). ODDference dropped
          its own proof/quote block in the 2027 rebuild (no verified stats
          or quote existed to populate it) — its speaker roster carries the
          social-proof job instead. On Home, pairs with "proofIntro" below —
          leave "eyebrow"/"title" blank here (the editorial framing lives in
          proofIntro instead). Home's four figures are ODD's cumulative
          totals across its whole first two years (2026-09-04), not one
          event's: keep them and proofIntro's wording in step. "cta" is the
          button under the figures (the ODDfest 2026 thank-you page since
          2026-09-14) and "ctaLead" the one short line set above it.
          "srValue" on an item is the spoken form of an abbreviated number
          ("€400K+" -> "More than €400,000") — set it whenever a value is
          shortened for the design, leave it blank otherwise.
        options:
          subtype: object
          required: false
      proofIntro:
        type: object
        label: '"Already in motion" proof intro (Home only)'
        comment: >-
          NEW (2026-09-02 copywriting pass): the eyebrow/headline/body/cta
          rendered directly above the bare "proof" stat row below it.
        options:
          subtype: object
          required: false
      caseTeaser:
        type: object
        label: Case/story teaser (Home only)
        comment: A single case, member story or ODDfest/ODDference highlight. Leave the field out entirely until a real one exists.
        options:
          subtype: object
          required: false
      join:
        type: object
        label: '"How to join" (ODDfest only)'
        comment: >-
          The page's one ask — eyebrow/headline/body, two buttons and a line
          of reassurance. This is the real, live "we're now collecting ideas
          for 2027" call, not a leave-it-out-until-ready field like proof
          elsewhere: keep it populated. "cta" is the main one (submit an
          event idea); "altCta" is for a reader who is interested but has
          nothing to submit yet, so the section has no dead end. Keep
          "reassurance" — the commonest reason a host never submits is
          believing their idea isn't finished enough to show anyone, and
          that one line is what answers it. Renders directly after "How it
          works"; don't move it earlier. (Was "register" until 2026-09-11.)
        options:
          subtype: object
      ownership:
        type: object
        label: '"How it works" — who does what (ODDfest only)'
        comment: >-
          The host/ODD responsibility split, plus the closing line and the
          small label above the four numbered steps ("How it works" below),
          which render inside this same section. Was "sharedLayer" until
          2026-09-11, when its "shared platform" sub-block was deleted: it
          promised 2027 programme and discovery-platform features nobody had
          built or confirmed. Don't put that promise back until the platform
          actually exists and you can describe what it does.
        options:
          subtype: object
      lookBack:
        type: object
        label: '"Look back at 2026" buttons (ODDfest only)'
        comment: >-
          The two archive links under "What ODDfest is": "thankYou" points at
          the archived 2026 thank-you page hosted on this site at
          /oddfest-2026/, and "oldSite" at oddfest.co, the 2026 site still
          live on its own domain. Set "external: true" on a link to open it
          in a new tab — it's on for oddfest.co (a different domain) and off
          for the archived page, which is ours and has its own way back.
        options:
          subtype: object
      examplesIntro:
        type: object
        label: '"Highlights" section framing (ODDfest only)'
        comment: >-
          The eyebrow/headline/body/closing shown above the real "examples"
          cards below. This section only renders while "examples" is
          non-empty.
        options:
          subtype: object
      programmeHighlights:
        type: object
        label: '"On the programme" names (ODDfest only)'
        comment: >-
          Names from past ODDfest programmes, grouped under a label (Music &
          performance, Talks & ideas, Partners, ...) with one line of names
          per group, separated by " · ". Only list people and organisations
          that actually took part, not ones that were only announced. The
          section is hidden while "groups" is empty.
        options:
          subtype: object
      hostCta:
        type: object
        label: '"Want your event in the next one?" band (ODDfest only)'
        comment: >-
          The short ask under the programme names, sending hosts to the event
          submission form. Keep its link on the same route as "How to join"
          (/contact/?topic=oddfest_2027_event) so both asks land in one place.
        options:
          subtype: object
      casesIntro:
        type: object
        label: '"What we have built with our partners" heading (Work with ODD only)'
        comment: >-
          Eyebrow, headline and an optional one-line intro above the case
          cards. The section is hidden while "Case studies" is empty.
        options:
          subtype: object
      concept:
        type: object
        label: Concept explainer (ODDference only)
        comment: >-
          The one-paragraph "what is ODDference" block directly under the
          hero. No separate "Big Question" section repeats it further down
          the page.
        options:
          subtype: object
      partnershipCta:
        type: object
        label: Partnership callout (ODDference only)
        comment: Routes business partners to the Work with ODD contact form (?interest=oddference_corporate).
        options:
          subtype: object
      network:
        type: object
        label: Logo strip heading
        comment: >-
          The eyebrow/title shown above a logo strip. On Membership this
          sits above the shared sitewide partner logos (edited under Global
          → Partner logos). On Work with ODD it sits above that page's own
          curated "logos" list below instead — the two pages intentionally
          show different organisations, so don't point one at the other's
          list. About no longer carries a partner-logo wall of its own.
        options:
          subtype: object
      story:
        type: object
        label: Our story / timeline (About only)
        comment: >-
          "legalNote" is the one place the New Nordic Way rf operator fact
          lives on this page — a quiet caption under the timeline, not its
          own section.
        options:
          subtype: object
      contact:
        type: object
        label: Contact block
        comment: >-
          On Work with ODD, the short prompt above the embedded enquiry form.
          On Privacy & cookies, the controller's name, email and postal
          address at the foot of the policy — which GDPR Article 13 requires
          to be there, so empty it at your peril.
        options:
          subtype: object
      lastUpdated:
        type: text
        label: Last updated (legal pages only)
        comment: >-
          Shown at the top of the policy. Change it whenever you change
          anything below — a policy with a stale date is weaker evidence of
          what was in force when. Written out in full, e.g. "3 September 2026".
      sections:
        type: array
        label: Policy sections (legal pages only)
        comment: >-
          The body of the policy, in order. Each section is a heading, one or
          more paragraphs, and an optional bulleted list. The cookie table is
          NOT edited here — it is generated from the site's own consent
          configuration so it cannot disagree with what the site actually
          sets.
        options:
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
      cookieSection:
        type: object
        label: Cookie section intro (legal pages only)
        comment: >-
          The prose above and around the automatically generated cookie
          table, plus the label on the button that reopens the cookie banner.
        options:
          subtype: object
      finalCta:
        type: object
        label: Closing CTA (Membership only)
        options:
          subtype: object
      howItWorks:
        type: array
        label: How it works
        comment: Appears on ODDfest, ODDagency and ODDspace, each with its own steps.
        options:
          structures: _structures.feature_card
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      whenOddIsUseful:
        type: object
        label: When ODD is useful (Work with ODD only)
        comment: >-
          NEW (2026-09-02 copywriting pass): the organisational use-case
          section right after the hero — eyebrow/headline plus 3 short
          items. Renders as a plain numbered list, not a card grid.
        options:
          subtype: object
      whenThisWorks:
        type: object
        label: When ODDagency makes sense (ODDagency only)
        comment: >-
          NEW (2026-09-02 copywriting pass): says when to buy ODDagency,
          right after the hero — eyebrow/headline plus 4 short items.
        options:
          subtype: object
      closingCta:
        type: object
        label: Closing CTA (ODDagency only)
        comment: >-
          Replaced the old two-card "Bring us a brief / Talk to us first"
          participate band (2026-09-02 copywriting pass — "one clear exit is
          enough"): a single headline/body/link.
        options:
          subtype: object
      reasonsIntro:
        type: object
        label: Heading above the three reasons (ODDference only)
        comment: >-
          NEW (2026-09-11): the eyebrow + headline over the three
          "reasons" blocks. Without it those blocks read as a continuation
          of "The premise" above rather than as the page's three arguments.
        options:
          subtype: object
      capabilities:
        type: array
        label: Capabilities (ODDagency only)
        options:
          structures: _structures.feature_card
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      programme:
        type: array
        label: Programme / schedule
        comment: Appears on ODDfest and (optionally) ODDference.
        options:
          structures: _structures.programme_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      examples:
        type: array
        label: '"Highlights" cards (ODDfest only)'
        comment: >-
          Real, named events that actually happened — Creative Week talks,
          gatherings, salons, panels, performances. Photo is optional (a card
          without one gets a plain surface instead). Set "external: true" when
          the link goes to a partner's own page, so it opens in a new tab. No
          placeholder or invented events; the section is hidden while this is
          empty.
        options:
          structures: _structures.creative_week_example
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      groups:
        type: array
        label: Name groups ("On the programme", ODDfest only)
        comment: >-
          One group per row: a short label (e.g. "Music & performance") and a
          single line of names separated by " · ". Only names that actually
          took part.
        options:
          structures: _structures.audience_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      sessionHighlights:
        type: array
        label: Session highlights (ODDference only)
        comment: >-
          NEW (2026-09-11): real sessions from ODDference 2026, as proof of
          what the event is actually like. Titles are taken verbatim from
          the event's own run sheet — don't rewrite them into marketing
          copy, and don't add a session that didn't happen. "Format" is
          Keynote or Fireside chat; "Speakers" is a plain display line
          ("A, B & C"). Five, shown as a compact list under the speakers
          (2026-09-17) — keep it short; the section doesn't render while
          this is empty.
        options:
          structures: _structures.session_highlight_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      faq:
        type: array
        label: Practical / FAQ
        comment: >-
          Appears on ODDfest, ODDspace and (since 2026-09-11) ODDference.
          Uses a real accordion — no HTML allowed in the answer text.
          ODDference 2027 has a lot that genuinely isn't decided yet
          (dates, venues, programme, exactly what a ticket covers beyond
          ODDference itself): say so in the answer rather than filling it
          in, the same rule the rest of this page's content follows.
        options:
          structures: _structures.faq_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      reasons:
        type: array
        label: Three reasons to come (ODDference only)
        comment: >-
          Major editorial blocks (Ideas / People / Experience), not small
          feature cards — each can carry its own photo.
        options:
          structures: _structures.reason_card
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      speakers:
        type: array
        label: Speakers (ODDference only)
        comment: >-
          ODDference 2026's confirmed speaker roster (social proof, not a
          2027 line-up) — real names, roles and photos only. Leave empty
          rather than adding placeholder names. Ten, laid out 5 × 2 on
          desktop and 2 × 5 on phones (2026-09-17): keep it at ten.
        options:
          structures: _structures.person_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      tickets:
        type: array
        label: Tickets (ODDference only)
        comment: >-
          The whole ticket ladder — Blind Bird, Early Bird, Regular — not
          only the tier on sale (2026-09-11). Price, the VAT note beside it
          ("priceNote", now "+ VAT 13.5%" — prices are ex-VAT), status,
          benefits and button are read from the ticket backend at page load, so what you
          type here is the fallback a visitor sees if that request fails:
          keep it truthful, but change a real price in the backend, not
          here. Two fields are yours alone, because the backend has no
          equivalent: "badgeLabel" is the label on the badge above the tier
          currently on sale (now "Available until 1 Nov 2026" — leave empty
          for the old "Recommended"), and "locked: true" marks a tier as not
          yet purchasable, which dims the card and removes its button while
          leaving its real price readable. The backend overrides "locked"
          the moment it opens that tier.
        options:
          structures: _structures.pricing_tier
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      tiers:
        type: array
        label: Membership tiers (Membership only)
        comment: >-
          Leave this empty (the default) until pricing/tiers are ready — the
          page skips the whole section when it's empty rather than showing
          invented pricing.
        options:
          structures: _structures.pricing_tier
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      aftermovie:
        type: object
        label: Aftermovie (ODDference only)
        comment: >-
          No dedicated ODDference aftermovie exists yet — leave this field
          out entirely (the section doesn't render) rather than reusing the
          generic homepage aftermovie footage under the ODDference name.
        options:
          subtype: object
          required: false
      partners:
        type: array
        label: Partners & collaborators (ODDference only)
        comment: >-
          Organisations verified as ODDference-specific partners or
          collaborators — not the sitewide Global → Partner logos list
          (those aren't attributable to any one page/year). Leave empty
          until a real, verified ODDference list exists; the section
          doesn't render while it's empty.
        options:
          structures: _structures.logo_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      cases:
        type: array
        label: Case studies
        comment: >-
          Appears on ODDagency and Work with ODD — the same real case can be
          listed on both. On Work with ODD only, a case can also carry a
          photo ("image"), its own link text ("linkLabel", instead of "Read
          more →") and "external: true" for a link that leaves this site
          (opens in a new tab).
        options:
          structures: _structures.case_study
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      logos:
        type: array
        label: Organisations we've worked with (Work with ODD only)
        comment: >-
          A page-specific curated set — deliberately not the sitewide
          "Partner logos" list (that mixes festival sponsors, press and
          historical relationships, which isn't the same claim as
          "organisations we've worked with"). Leave empty until this is
          curated by hand; the section stays hidden while it's empty, the
          same as Case studies above.
        options:
          structures: _structures.logo_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      jumpLinks:
        type: array
        label: Anchor shortcuts (Media only)
        comment: >-
          Optional compact jump-links row under the hero (e.g. About ODD /
          Media bank / Archive / Press contact). Leave the whole field out to
          drop it from the page.
        options:
          structures: _structures.link_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      boilerplate:
        type: object
        label: Boilerplate (Media only)
        comment: >-
          The reusable "what is ODD" description journalists/editors/AI
          systems can lift directly — keep this consistent with About's and
          Work with ODD's own approved framing of ODD/ODDfest/ODDference/
          ODDspace, don't reinvent it here. "bodyFi" is an optional Finnish
          version — leave blank until a real, approved Finnish press text
          exists. "keyFacts" is evergreen only (Based in / Operated by / Main
          activities) — no event dates, themes, curators or venues; those
          belong in Archive below. The "Website" fact shown on the page is
          derived automatically from the site's canonical URL, not stored
          here.
        options:
          subtype: object
      background:
        type: array
        label: Background reading (Media only)
        comment: >-
          Small, undated explainer resources (e.g. "Event Formats
          Explained") — separate from the dated Archive below because these
          explain what ODD's terms/formats mean rather than report on one
          year's edition. Optional: leave empty rather than invent one.
        options:
          structures: _structures.resource_link_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      mediaBank:
        type: object
        label: Media bank — logos, photos, video (Media only)
        comment: >-
          The "publish now" asset hub, split by type. "logos.items" are
          local wordmark/mark files only — no invented dark/light variants;
          "logos.driveLink" points to the fuller approved kit on Drive.
          Each photo item's own "usageNote" is that specific collection's
          credit/usage line — don't turn it into one blanket site-wide note
          unless a broader policy is actually confirmed.
        options:
          subtype: object
      archive:
        type: array
        label: Archive, by year (Media only)
        comment: >-
          "Research history" — past editions' dates/theme/curators/venues,
          past press releases, past impact reports. Grouped by year; add a
          year, then add resource links inside it. Never presented as
          current/evergreen truth — that's what boilerplate/keyFacts above
          are for. No invented years or entries.
        options:
          structures: _structures.archive_year_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      accreditationNotice:
        type: object
        label: Accreditation notice (Media only)
        comment: >-
          Optional and off by default ("active: false"). Only switch this on
          when media accreditation is genuinely, currently open — never
          invent an open process. Replaces the old permanent "Press
          accreditation" section.
        options:
          subtype: object
          required: false
      pressContact:
        type: object
        label: Press contact (Media only)
        comment: The named press/PR contact — separate from the general "Contact emails" under Global, which stays partnerships-focused.
        options:
          subtype: object
      followSocial:
        type: object
        label: Follow ODD heading (Media only)
        comment: >-
          Just the heading + supporting line — the actual platform/handle/
          link list is pulled live from Global → Social media links, so it
          can never drift from the real handles.
        options:
          subtype: object
      # Dotted paths configure inputs nested inside an object field above
      # (boilerplate, mediaBank) — CloudCannon's object input type doesn't
      # accept its own `_inputs` key, so structured sub-fields (arrays that
      # need a specific _structures reference) are configured here instead.
      boilerplate.keyFacts:
        type: array
        label: Key facts (Media only)
        options:
          structures: _structures.key_fact_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
      mediaBank.logos.items:
        type: array
        label: Logo files (Media only)
        options:
          structures: _structures.logo_asset_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
      mediaBank.logos.driveLink:
        type: object
        label: Full logo kit link (Media only)
        options:
          subtype: object
          required: false
      mediaBank.photos:
        type: array
        label: Photos (Media only)
        options:
          structures: _structures.resource_link_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
      mediaBank.video:
        type: array
        label: Video (Media only)
        options:
          structures: _structures.resource_link_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
    add_options:
      - name:
        icon:
        editor:
        base_path:
        collection:
        schema:
        default_content_file:
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
  site:
    path: src/content/site
    name: Global
    singular_name: Global content
    icon: public
    # Pure data — nav/footer/social links — not a page. No route to open in
    # the Visual Editor.
    disable_url: true
    include_developer_files: false
    _inputs:
      nav:
        type: array
        label: Main navigation
        comment: >-
          Drives the top nav, the footer links and the mobile menu — one edit
          here changes all three. ODDspace opens in a new tab, so leave its
          "external" toggle on. "Info" has "children" (Work with ODD/Media/
          About/Contact, in that order since 2026-09-11 — Work with ODD is
          the one most visitors opening this menu actually want, so it leads
          rather than sitting second behind About) — it shows as a hover
          dropdown on desktop, a
          labeled group on mobile, and flattens into plain links in the
          footer. Add "children" to any other item the same way to group it
          instead of adding a new top-level item. Work with ODD moved in
          here 2026-08-30 — it's no longer a primary destination alongside
          ODDfest/ODDference/ODDspace, it's where organisations go to go
          further; the route itself is still /work-with-odd.
        cascade: true
      social:
        type: array
        label: Social media links
        comment: Shown in the footer and the fullscreen menu.
        cascade: true
      formAccessKeys:
        type: object
        label: Form routing — Web3Forms access keys
        comment: >-
          Where each kind of message is emailed. One free key per topic from
          web3forms.com, each created with the address that topic should
          reach: General → hello@oddfest.co, Partnering & ODDference →
          partners@oddfest.co, ODDspace → space@oddfest.co, ODDfest →
          fest@oddfest.co. The Partnering key is used twice — the Contact
          page's "Partnering & ODDference" topic and the Work with ODD
          enquiry form both notify it. Who sits behind those group addresses
          is changed in Google Workspace admin, not here. Leave a topic blank
          and it falls back to the General key; leave General blank too and
          the contact form still shows but tells visitors it isn't connected
          yet instead of silently discarding what they type.
        options:
          subtype: object
      contact:
        type: array
        label: Contact emails
        comment: Shown in the footer, as "label — email".
        cascade: true
      footerAddress:
        type: text
        label: Footer address line
      newsletterHref:
        type: text
        label: Newsletter sign-up link
        comment: >-
          Where the footer and menu "Sign up" forms send visitors without
          JavaScript — the publication's real hosted subscribe page (e.g. a
          Beehiiv URL). With JavaScript the form posts to the Growth OS
          /api/newsletter route instead, so this is the fallback, not the
          only path. Currently `oddfest.beehiiv.com`: the publication is
          ODDfest-branded but serves the whole ecosystem, which is a real
          mismatch now that the site is All Things ODD. Renaming or
          re-domaining it takes Beehiiv account access — see B15 in
          docs/IDENTITY_LAUNCH_MATRIX_2026-09-04.md. Do not replace this
          with a guessed allthingsodd URL: a sign-up form pointing at a
          publication that does not exist loses every subscriber who tries.
      preRegister:
        type: object
        label: Pre-registration CTA (not currently shown anywhere)
        comment: >-
          Not rendered anywhere as of the 2026-08-30 homepage revision — it
          used to be the header's top-right nav button, but that slot is now
          the "Info" dropdown (About/Media/Contact) instead, and persistent
          newsletter UI moved to the footer only. Kept, not deleted, since
          the field still has a real future purpose (a genuine
          pre-registration CTA once one exists) and nothing currently reads
          this field's value — wire it up wherever that CTA should live when
          it's needed.
        options:
          subtype: object
      partners:
        type: array
        label: Partner logos
        comment: >-
          Shown on the homepage, grouped by "tier" (e.g. Partner / Supporter /
          Media — use whatever real tier names apply). Leave "tier" blank on
          a logo and it falls into one unlabeled group instead of a named
          column — don't guess a company's real sponsorship tier.
        options:
          structures: _structures.partner_logo_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      featuredIn:
        type: array
        label: '"Featured in" logos (press)'
        comment: >-
          Shown identically in the "Featured in" strip on both the homepage
          and the Media page — one shared list, edited here.
        options:
          structures: _structures.logo_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      logoWall:
        type: object
        label: Grouped logo wall (Partners / Media / Supported by / Collaborators)
        comment: >-
          Prepared for a future homepage section — NOT the live "Partners"
          section above (that keeps using the "Partner logos" list until
          this is switched on). Toggle "visible" on only once every logo in
          every group below has been confirmed for that specific category —
          don't guess which organisation belongs in which group.
        options:
          subtype: object
      supportedBy:
        type: array
        label: Footer "Supported by" logos
        comment: >-
          A small, quiet footer row — visually much quieter than the logo
          wall above. Only add a logo here once it's confirmed as a real
          foundation/funder, not a general partner — leave empty otherwise;
          the footer renders nothing when this list is empty.
        options:
          structures: _structures.logo_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
    disable_add: true
    disable_add_folder: false
    disable_file_actions: true
_structures:
  logo_item:
    style: select
    values:
      - label: Logo
        default: false
        preview:
          text:
            - key: name
          icon:
            - image
          image:
            - key: logo
        place_groups_below: false
        tabbed: false
        value:
          name: ''
          logo:
          # Only tick this on a verified real editorial/media outlet that has
          # actually covered ODD — not an award body, community, funder or
          # industry organisation. The Media page's "Featured in" only shows
          # items with this on; the homepage's own "Featured in" is
          # unaffected and keeps showing every logo regardless of this flag.
          pressCoverage: false
  link_item:
