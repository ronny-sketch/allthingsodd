source: .
collections_config:
  pages:
    path: src/content/pages
    name: Pages
    icon: description
    # index.json -> "" (Astro's own home-route convention, matched here) ->
    # "/". Every other file's name already equals its real route
    # (oddfest.json -> /oddfest/, etc.) — see astro.config.mjs's default
    # build.format: "directory", which is why every route needs the
    # trailing slash.
    url: '/[slug]/'
    disable_url: false
    include_developer_files: false
    preview:
      text:
        - key: title
        - key: eyebrow
    _inputs:
      seo:
        type: object
        options:
          subtype: object
          groups:
            - heading: SEO
              comment: Browser tab title, search-result snippet, and social share image.
              collapsed: false
              inputs:
                - title
                - description
                - ogImage
          required: false
        cascade: true
      platforms:
        type: array
        label: The ODD platform (Home only)
        comment: >-
          The large photo cards for ODDfest / ODDference / ODDspace / Work
          with ODD. Not fixed at four — add or remove a card and the grid
          reflows; a card can also skip its photo (falls back to a plain
          surface) if none is set.
        options:
          structures: _structures.program_card
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      pathways:
        type: array
        label: Four ways to work with ODD (Work with ODD only)
        comment: The large link-out cards for ODDference / Membership / Agency / Partnerships.
        options:
          structures: _structures.program_card
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      participate:
        type: array
        label: '"Ways to participate" cards'
        options:
          structures: _structures.cta
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      features:
        type: array
        label: Three-column feature grid
        comment: ODDference / ODDagency / ODDspace only — not on Home, About or ODDfest.
        options:
          structures: _structures.feature_card
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      primaryCta:
        type: object
        label: Primary button (ODDference only)
        comment: The solid "Buy your ticket"-style button in the hero. Home, ODDfest, ODDagency and About don't use this field.
        options:
          subtype: object
      formAccessKey:
        type: text
        label: Web3Forms access key (Contact page only)
        comment: >-
          Free key from web3forms.com — paste it here to make the Contact
          page's form actually send. Leave blank and the form still shows,
          but tells visitors it isn't connected yet instead of silently
          discarding what they type.
      heroMedia:
        type: object
        label: Hero video/image
        comment: >-
          Which of "video"/"poster"/"image" actually apply depends on the
          page — ODDfest and ODDference use a video + poster frame,
          ODDagency uses a single still image instead. Leave the ones the
          page doesn't use empty.
        options:
          subtype: object
      railLeft:
        type: array
        label: Left side ticker (decorative)
        comment: >-
          The scrolling logo/word/date strip fixed to the left edge on
          desktop. Low editorial priority — safe to leave as-is.
        cascade: true
      railRight:
        type: array
        label: Right side ticker (decorative)
        comment: Same as the left ticker, mirrored on the right edge.
        cascade: true
      panels:
        type: array
        label: About page panels (opening scroll)
        options:
          structures: _structures.about_panels
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        comment: >-
          The four horizontal-scroll panels that open the About page (What is
          ODD / Why we exist / How it works / One platform), in this order.
          Add a "Photo panel" or "Text-only panel" to insert a new one
          anywhere in the sequence. The deeper sections further down the page
          (Story, Proof, People, Network, Ambition) are separate fields
          below, not part of this scroll.
        cascade: true
      opening:
        type: object
        label: Proposition (Home only)
        comment: >-
          The headline that renders directly under the ODD logo inside the
          hero mosaic itself — this is the page's real "what is ODD" moment.
          Its two optional buttons render further down the page instead, in
          the "More than one event" section (see index.astro).
        options:
          subtype: object
      whatOddIs:
        type: object
        label: '"What ODD is" (Home only)'
        options:
          subtype: object
      whatItIs:
        type: object
        label: '"What it is" intro'
        comment: >-
          Appears on ODDagency, ODDspace and Membership — each page's own
          short explainer section. On ODDfest this same field is the "What
          ODDfest is" section — the consolidated made-across-Helsinki /
          organisers-keep-ownership / ODD-provides-the-umbrella story, with
          its own optional cta as the page's earlier "register" link.
        options:
          subtype: object
      community:
        type: object
        label: '"Who it''s for" (ODDspace only)'
        options:
          subtype: object
      whatYouGet:
        type: array
        label: What you get (ODDspace only)
        comment: The membership benefits list.
        options:
          structures: _structures.feature_card
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      membership:
        type: object
        label: Membership (ODDspace only)
        comment: >-
          One flat membership tier (not an array like ODDference's tickets
          or Membership's tiers) — ODDspace's real pricing is deliberately
          one rate, no tiers.
        options:
          subtype: object
      rentalRates:
        type: array
        label: Event space rental rates (ODDspace only)
        comment: >-
          Member pricing for renting the gallery/auditorium. No invented
          prices — these are real, current rates.
        options:
          required: false
        cascade: true
      location:
        type: object
        label: Location (ODDspace only)
        options:
          subtype: object
      calendar:
        type: object
        label: Events calendar embed (ODDspace only)
        comment: >-
          "embedUrl" must be a real Google Calendar /calendar/embed?src=...
          URL (not the "view calendar" share link) — see docs/editing.md.
          Optional: leave the whole field out rather than embed a broken or
          placeholder calendar.
        options:
          subtype: object
          required: false
      twoWaysIn:
        type: object
        label: '"Two ways in" (Home only)'
        comment: The business/creative dual-entry section. Keep the framing reciprocal, not "business buys, creatives belong".
        options:
          subtype: object
      whatsHappening:
        type: object
        label: '"What''s happening" (Home only)'
        comment: >-
          "note" is the small disclaimer line under the activity list.
          "items" is the flat, editable list of current activity — mix
          ODDfest/ODDference/ODDspace/member items freely, each with its own
          category tag.
        options:
          subtype: object
      proof:
        type: object
        label: Proof / traction
        comment: >-
          Appears on Home, About, ODDference and ODDspace (required on
          ODDspace — its pilot-phase numbers are the whole point of the
          section). Elsewhere, leave this field out of the page entirely
          (delete it) rather than filling it with invented numbers.
          ODDference's version can also carry an optional attendee quote.
        options:
          subtype: object
          required: false
      workWithOdd:
        type: object
        label: '"Work with ODD" teaser (Home only)'
        options:
          subtype: object
      caseTeaser:
        type: object
        label: Case/story teaser (Home only)
        comment: A single case, member story or ODDfest/ODDference highlight. Leave the field out entirely until a real one exists.
        options:
          subtype: object
          required: false
      register:
        type: object
        label: '"Register your event" (ODDfest only)'
        comment: >-
          The primary CTA section — headline/body/cta. This is the real,
          live "we're now collecting ideas for 2027" call, not a
          leave-it-out-until-ready field like proof elsewhere: keep it
          populated.
        options:
          subtype: object
      bigQuestion:
        type: object
        label: The big question (ODDference only)
        comment: 'The framing section built around: "what can business and the rest of society learn from creative expertise?"'
        options:
          subtype: object
      connection:
        type: object
        label: Connection & networking (ODDference only)
        options:
          subtype: object
      partnershipCta:
        type: object
        label: Partnership callout (ODDference only)
        comment: Routes business partners to Work with ODD.
        options:
          subtype: object
      network:
        type: object
        label: Partners / network note
        comment: >-
          Appears on About, Work with ODD and Membership, right above the
          shared partner logo strip (edited under Global → Partner logos —
          the same list everywhere it's shown).
        options:
          subtype: object
      ambition:
        type: object
        label: The bigger picture (About only)
        comment: Optional — for longer-term thinking introduced later. Leave the field out entirely until there's real content for it.
        options:
          subtype: object
          required: false
      people:
        type: object
        label: People & organisation (About only)
        options:
          subtype: object
      story:
        type: object
        label: Our story / timeline (About only)
        options:
          subtype: object
      contact:
        type: object
        label: Contact intro (Work with ODD only)
        comment: The short prompt shown above the embedded inquiry form.
        options:
          subtype: object
      finalCta:
        type: object
        label: Closing CTA (Membership only)
        options:
          subtype: object
      howItWorks:
        type: array
        label: How it works
        comment: Appears on ODDfest, ODDagency and ODDspace, each with its own steps.
        options:
          structures: _structures.feature_card
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      whyOdd:
        type: array
        label: Why ODD
        comment: Appears on ODDagency and Work with ODD.
        options:
          structures: _structures.feature_card
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      howWeWork:
        type: array
        label: How we work (Work with ODD only)
        options:
          structures: _structures.feature_card
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      whyAttend:
        type: array
        label: Why attend (ODDference only)
        options:
          structures: _structures.feature_card
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      whyJoin:
        type: array
        label: Why join (Membership only)
        options:
          structures: _structures.feature_card
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      capabilities:
        type: array
        label: Capabilities (ODDagency only)
        options:
          structures: _structures.feature_card
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      programme:
        type: array
        label: Programme / schedule
        comment: Appears on ODDfest and (optionally) ODDference.
        options:
          structures: _structures.programme_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      examples:
        type: array
        label: '"Last year, this looked like…" examples (ODDfest only)'
        comment: >-
          Real, named 2026 Creative Week examples — exhibitions,
          performances, screenings, club nights, workshops, talks. Photo is
          optional (a card without one gets a plain surface instead). Leave
          this empty until real, verified 2026 events/hosts exist — the
          section itself doesn't render while it's empty. No placeholder or
          invented events.
        options:
          structures: _structures.creative_week_example
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      faq:
        type: array
        label: Practical / FAQ
        comment: >-
          Appears on ODDfest, ODDference and ODDspace. Uses a real accordion
          — no HTML allowed in the answer text.
        options:
          structures: _structures.faq_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      whoItsFor:
        type: array
        label: Who it's for
        comment: Appears on ODDference and Membership.
        options:
          structures: _structures.audience_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      themes:
        type: array
        label: Themes (ODDference only)
        options:
          structures: _structures.title_body_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      includes:
        type: array
        label: What membership includes (Membership only)
        options:
          structures: _structures.title_body_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      speakers:
        type: array
        label: Speakers (ODDference only)
        comment: Leave empty until real speakers are confirmed — no placeholder names.
        options:
          structures: _structures.person_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      tickets:
        type: array
        label: Tickets (ODDference only)
        comment: No invented prices — leave "price" as an explicit placeholder until real pricing exists.
        options:
          structures: _structures.pricing_tier
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      tiers:
        type: array
        label: Membership tiers (Membership only)
        comment: >-
          Leave this empty (the default) until pricing/tiers are ready — the
          page skips the whole section when it's empty rather than showing
          invented pricing.
        options:
          structures: _structures.pricing_tier
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      cases:
        type: array
        label: Case studies
        comment: Appears on ODDagency and Work with ODD — the same real case can be listed on both.
        options:
          structures: _structures.case_study
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      accreditation:
        type: object
        label: Accreditation (Media only)
        comment: The media-accreditation callout and its application link.
        options:
          subtype: object
      keyFacts:
        type: array
        label: Key facts (Media only)
        options:
          structures: _structures.key_fact_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      highlights:
        type: object
        label: Highlights (Media only)
        comment: >-
          The "last edition, in numbers" stat grid. Leave this field out
          entirely rather than filling it with invented figures — same rule
          as the "proof" field elsewhere on the site.
        options:
          subtype: object
          required: false
      boilerplate:
        type: object
        label: Boilerplate (Media only)
        comment: The one-paragraph company description journalists can lift directly.
        options:
          subtype: object
      pressReleases:
        type: array
        label: Press releases (Media only)
        options:
          structures: _structures.resource_link_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      infoPacks:
        type: array
        label: Info packs (Media only)
        options:
          structures: _structures.resource_link_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      assets:
        type: object
        label: Assets & photos (Media only)
        comment: '"usageNote" is the photo-credit line shown above the list of links.'
        options:
          subtype: object
      pressContact:
        type: object
        label: Press contact (Media only)
        comment: The named press/PR contact — separate from the general "Contact emails" under Global, which stays partnerships-focused.
        options:
          subtype: object
      photobank:
        type: object
        label: Photobank (Media only)
        comment: >-
          Visual Flickr embeds — real, live photo galleries, not just links
          (those already live under "Assets & photos"). Each item needs a
          representative placeholder photo (url/width/height) shown before
          Flickr's own embed script upgrades it into the full gallery widget.
          Optional: leave the whole field out rather than invent a link.
        options:
          subtype: object
    add_options:
      - name:
        icon:
        editor:
        base_path:
        collection:
        schema:
        default_content_file:
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
  site:
    path: src/content/site
    name: Global
    singular_name: Global content
    icon: public
    # Pure data — nav/footer/social links — not a page. No route to open in
    # the Visual Editor.
    disable_url: true
    include_developer_files: false
    _inputs:
      nav:
        type: array
        label: Main navigation
        comment: >-
          Drives the top nav, the footer links and the mobile menu — one edit
          here changes all three. ODDspace opens in a new tab, so leave its
          "external" toggle on. "Info" has "children" (About/Media/Contact) —
          it shows as a hover dropdown on desktop, a labeled group on mobile,
          and flattens into plain links in the footer. Add "children" to any
          other item the same way to group it instead of adding a new
          top-level item.
        cascade: true
      social:
        type: array
        label: Social media links
        comment: Shown in the footer and the fullscreen menu.
        cascade: true
      contact:
        type: array
        label: Contact emails
        comment: Shown in the footer, as "label — email".
        cascade: true
      footerAddress:
        type: text
        label: Footer address line
      newsletterHref:
        type: text
        label: Newsletter sign-up link
        comment: >-
          Where the footer and menu "Sign up" forms send visitors — the
          publication's real hosted subscribe page (e.g. a Beehiiv URL).
      preRegister:
        type: object
        label: Top-right nav button (top right of every page)
        comment: >-
          Currently points at the newsletter signup — there's no real
          pre-registration destination yet, so this is filled in with the
          most useful honest CTA available rather than a dead link. Point
          it at a real pre-registration URL when one exists.
        options:
          subtype: object
      partners:
        type: array
        label: Partner logos
        comment: >-
          Shown on the homepage, grouped by "tier" (e.g. Partner / Supporter /
          Media — use whatever real tier names apply). Leave "tier" blank on
          a logo and it falls into one unlabeled group instead of a named
          column — don't guess a company's real sponsorship tier.
        options:
          structures: _structures.partner_logo_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      featuredIn:
        type: array
        label: '"Featured in" logos (press)'
        comment: >-
          Shown identically in the "Featured in" strip on both the homepage
          and the Media page — one shared list, edited here.
        options:
          structures: _structures.logo_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
    disable_add: true
    disable_add_folder: false
    disable_file_actions: true
_structures:
  logo_item:
    style: select
    values:
      - label: Logo
        default: false
        preview:
          text:
            - key: name
          icon:
            - image
          image:
            - key: logo
        place_groups_below: false
        tabbed: false
        value:
          name: ''
          logo:
  partner_logo_item:
    style: select
    values:
      - label: Partner logo
        default: false
        preview:
          text:
            - key: name
            - key: tier
          icon:
            - image
          image:
            - key: logo
        place_groups_below: false
        tabbed: false
        value:
          name: ''
          logo:
          tier: ''
  program_card:
    style: select
    values:
      - label: Program card
        default: false
        preview:
          text:
            - key: title
          icon:
            - image
          image:
            - key: image
        place_groups_below: false
        tabbed: false
        value:
          meta: ''
          title: ''
          body: ''
          goLabel: ''
          href: '#'
          image:
  cta:
    style: select
    values:
      - label: Call to action
        default: false
        preview:
          text:
            - key: title
          icon:
            - ads_click
        place_groups_below: false
        tabbed: false
        value:
          eyebrow: ''
          title: ''
          linkLabel: ''
          href: '#'
  feature_card:
    style: select
    values:
      - label: Feature
        default: false
        preview:
          text:
            - key: title
          icon:
            - star
        place_groups_below: false
        tabbed: false
        value:
          number: '01'
          title: ''
          body: ''
  # One structure with three selectable values — not three separate
  # structures — per CloudCannon's own documented pattern for a single array
  # that offers a choice of shapes (a page-builder-style field). Confirmed
  # against github.com/CloudCannon/agent-skills' structures.md: a
  # multi-shape array is one _structures.<name> entry with multiple
  # `values:`, referenced as a single string, not a list of structure names.
  about_panels:
    style: select
    values:
      - label: Photo panel
        default: false
        preview:
          text:
            - key: title
          icon:
            - image
        place_groups_below: false
        tabbed: false
        value:
          _kind: media
          image:
          alt: ''
          eyebrow: ''
          title: ''
          body: ''
      - label: '"Four ways in" program list panel'
        preview:
          text:
            - key: title
          icon:
            - list
        place_groups_below: false
        tabbed: false
        value:
          _kind: model
          eyebrow: ''
          title: ''
          items: []
      - label: Text-only panel
        preview:
          text:
            - key: title
          icon:
            - article
        place_groups_below: false
        tabbed: false
        value:
          _kind: text
          eyebrow: ''
          title: ''
          body: ''
  proof_item:
    style: select
    values:
      - label: Proof figure
        default: false
        preview:
          text:
            - key: label
            - key: value
          icon:
            - bar_chart
        place_groups_below: false
        tabbed: false
        value:
          value: '—'
          label: ''
  activity_item:
    style: select
    values:
      - label: Activity
        default: false
        preview:
          text:
            - key: title
            - key: category
          icon:
            - event
        place_groups_below: false
        tabbed: false
        value:
          date: 'TBD'
          category: ''
          title: ''
          description: ''
          href: '#'
  milestone_item:
    style: select
    values:
      - label: Milestone
        default: false
        preview:
          text:
            - key: title
            - key: year
          icon:
            - flag
        place_groups_below: false
        tabbed: false
        value:
          year: '—'
          title: ''
          body: ''
  title_body_item:
    style: select
    values:
      - label: Item
        default: false
        preview:
          text:
            - key: title
          icon:
            - article
        place_groups_below: false
        tabbed: false
        value:
          title: ''
          body: ''
  programme_item:
    style: select
    values:
      - label: Programme item
        default: false
        preview:
          text:
            - key: title
            - key: category
          icon:
            - event
        place_groups_below: false
        tabbed: false
        value:
          title: ''
          organiser: ''
          category: ''
          date: 'TBD'
          time: 'TBD'
          venue: ''
          description: ''
          href: '#'
  faq_item:
    style: select
    values:
      - label: Question
        default: false
        preview:
          text:
            - key: question
          icon:
            - help
        place_groups_below: false
        tabbed: false
        value:
          question: ''
          answer: ''
  audience_item:
    style: select
    values:
      - label: Audience
        default: false
        preview:
          text:
            - key: label
          icon:
            - group
        place_groups_below: false
        tabbed: false
        value:
          label: ''
          description: ''
  person_item:
    style: select
    values:
      - label: Person
        default: false
        preview:
          text:
            - key: name
            - key: role
          icon:
            - person
        place_groups_below: false
        tabbed: false
        value:
          name: ''
          role: ''
          organisation: ''
          bio: ''
  pricing_tier:
    style: select
    values:
      - label: Pricing option
        default: false
        preview:
