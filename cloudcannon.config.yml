source: .
collections_config:
  pages:
    path: src/content/pages
    name: Pages
    icon: description
    disable_url: false
    include_developer_files: false
    preview:
      text:
        - key: title
        - key: eyebrow
    _inputs:
      seo:
        type: object
        options:
          subtype: object
          groups:
            - heading: SEO
              comment: Browser tab title, search-result snippet, and social share image.
              collapsed: false
              inputs:
                - title
                - description
                - ogImage
          required: false
        cascade: true
      news:
        type: array
        label: News filmstrip photos
        options:
          structures:
            - news_item
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        comment: Homepage-only. Reorder here reorders the live site.
        cascade: true
      whatsOn:
        type: object
        label: "What's On"
        comment: >-
          The "note" is the small disclaimer line under the two date
          columns. Each column is its own list of dated entries, top to
          bottom.
        options:
          subtype: object
          required: false
        cascade: true
      programGrid:
        type: array
        label: Program cards (ODDfest / ODDference / ODDspace / ODDagency)
        comment: Homepage-only. The four large photo cards.
        options:
          structures:
            - program_card
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      participate:
        type: array
        label: '"Ways to participate" cards'
        options:
          structures:
            - cta
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      features:
        type: array
        label: Three-column feature grid
        comment: Subpages only (ODDfest / ODDference / ODDagency) — not on Home or About.
        options:
          structures:
            - feature_card
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        cascade: true
      primaryCta:
        type: object
        label: Primary button (ODDference only)
        comment: The solid "Buy your ticket"-style button in the hero. Home, ODDfest, ODDagency and About don't use this field.
        options:
          subtype: object
      heroMedia:
        type: object
        label: Hero video/image
        comment: >-
          Which of "video"/"poster"/"image" actually apply depends on the
          page — ODDfest and ODDference use a video + poster frame,
          ODDagency uses a single still image instead. Leave the ones the
          page doesn't use empty.
        options:
          subtype: object
      railLeft:
        type: array
        label: Left side ticker (decorative)
        comment: >-
          The scrolling logo/word/date strip fixed to the left edge on
          desktop. Low editorial priority — safe to leave as-is.
        cascade: true
      railRight:
        type: array
        label: Right side ticker (decorative)
        comment: Same as the left ticker, mirrored on the right edge.
        cascade: true
      panels:
        type: array
        label: About page panels
        options:
          structures:
            - about_panel_media
            - about_panel_model
            - about_panel_text
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        comment: >-
          The five horizontal-scroll panels on the About page, in this
          order. Add a "Photo panel" or "Text-only panel" to insert a new
          one anywhere in the sequence.
        cascade: true
    add_options:
      - name:
        icon:
        editor:
        base_path:
        collection:
        schema:
        default_content_file:
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
  site:
    path: src/content/site
    name: Global
    singular_name: Global content
    icon: public
    disable_url: false
    include_developer_files: false
    _inputs:
      nav:
        type: array
        label: Main navigation
        comment: >-
          Shared by the top nav and footer — one edit here changes both.
          ODDspace opens in a new tab, so leave its "external" toggle on;
          the other four are pages on this site, leave theirs off.
        cascade: true
      social:
        type: array
        label: Social media links
        comment: Shown in the footer and the fullscreen menu.
        cascade: true
      contact:
        type: array
        label: Contact emails
        comment: Shown in the footer, as "label — email".
        cascade: true
      footerAddress:
        type: text
        label: Footer address line
      preRegister:
        type: object
        label: '"Pre-register" button (top right of every page)'
        options:
          subtype: object
    disable_add: true
    disable_add_folder: false
    disable_file_actions: true
_structures:
  news_item:
    style: select
    values:
      - label: News photo
        default: false
        preview:
          text:
            - key: caption
          image:
            - key: image
        place_groups_below: false
        tabbed: false
        value:
          image:
          caption: ''
          href: '#'
  program_card:
    style: select
    values:
      - label: Program card
        default: false
        preview:
          text:
            - key: title
          image:
            - key: image
        place_groups_below: false
        tabbed: false
        value:
          meta: ''
          title: ''
          body: ''
          goLabel: ''
          href: '#'
          image:
  cta:
    style: select
    values:
      - label: Call to action
        default: false
        preview:
          text:
            - key: title
        place_groups_below: false
        tabbed: false
        value:
          eyebrow: ''
          title: ''
          linkLabel: ''
          href: '#'
  feature_card:
    style: select
    values:
      - label: Feature
        default: false
        preview:
          text:
            - key: title
        place_groups_below: false
        tabbed: false
        value:
          number: '01'
          title: ''
          body: ''
  about_panel_media:
    style: select
    values:
      - label: Photo panel
        default: false
        preview:
          text:
            - key: title
        place_groups_below: false
        tabbed: false
        value:
          _kind: media
          image:
          alt: ''
          eyebrow: ''
          title: ''
          body: ''
  about_panel_model:
    style: select
    values:
      - label: '"Four ways in" program list panel'
        default: false
        preview:
          text:
            - key: title
        place_groups_below: false
        tabbed: false
        value:
          _kind: model
          eyebrow: ''
          title: ''
          items: []
  about_panel_text:
    style: select
    values:
      - label: Text-only panel
        default: false
        preview:
          text:
            - key: title
        place_groups_below: false
        tabbed: false
        value:
          _kind: text
          eyebrow: ''
          title: ''
          body: ''
timezone: Etc/UTC
